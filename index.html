<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07060c" />
    <meta
      name="description"
      content="WEAVERFALL — a cinematic action-adventure in The Loom, a living dream-city woven from memories."
    />
    <title>WEAVERFALL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%2307060c' width='64' height='64'/%3E%3Cpath d='M12 44 C22 18 42 18 52 44' fill='none' stroke='%236ee7ff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='22' r='4' fill='%23ff6ad5'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="WEAVERFALL game canvas"></canvas>
      <div id="bloom-layer" aria-hidden="true"></div>
      <div id="grain" aria-hidden="true"></div>
      <div id="vignette" aria-hidden="true"></div>
      <div id="chromatic" aria-hidden="true"></div>

      <div id="hud" class="hud hidden">
        <div class="hud-left">
          <div class="hp-row" id="hp-row"></div>
          <div class="meter-row">
            <span class="meter-label">Solace</span>
            <div class="meter solace"><i id="bond-solace"></i></div>
          </div>
          <div class="meter-row">
            <span class="meter-label">Vesper</span>
            <div class="meter vesper"><i id="bond-vesper"></i></div>
          </div>
        </div>
        <div class="hud-center">
          <div id="zone-chip" class="zone-chip">The Spindle</div>
          <div id="toast" class="toast"></div>
        </div>
        <div class="hud-right">
          <div class="frag-chip" title="Memory Fragments">
            <span class="frag-gem"></span>
            <span id="frag-count">0</span>
          </div>
          <div id="ability-pills" class="ability-pills"></div>
        </div>
      </div>

      <div id="touch" class="touch hidden" aria-hidden="true">
        <div id="stick-base" class="stick-base">
          <div id="stick-knob" class="stick-knob"></div>
        </div>
        <div class="touch-actions">
          <button type="button" id="btn-ability" class="round-btn ghost">✦</button>
          <button type="button" id="btn-dash" class="round-btn">DASH</button>
        </div>
      </div>

      <div id="overlay" class="overlay">
        <div id="title-screen" class="panel title-panel">
          <p class="eyebrow">a memory of the loom</p>
          <h1 class="logo" id="logo">WEAVERFALL</h1>
          <p class="tagline">Paint causality. Mend what frays. Remember who remains.</p>
          <div class="title-actions">
            <button type="button" id="btn-new" class="btn primary">New Game</button>
            <button type="button" id="btn-continue" class="btn" disabled>Continue</button>
            <button type="button" id="btn-settings" class="btn ghost">Settings</button>
          </div>
          <p class="hint-line">WASD / stick to move · drag to weave · Shift to dash</p>
        </div>

        <div id="settings-screen" class="panel settings-panel hidden">
          <h2>Settings</h2>
          <label class="toggle">
            <input type="checkbox" id="set-mute" />
            <span>Mute audio</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="set-shake" checked />
            <span>Screen shake</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="set-reduce" />
            <span>Softer bloom</span>
          </label>
          <button type="button" id="btn-settings-back" class="btn">Back</button>
        </div>

        <div id="pause-screen" class="panel pause-panel hidden">
          <h2>Paused</h2>
          <p class="pause-lore" id="pause-lore">The Loom holds its breath.</p>
          <button type="button" id="btn-resume" class="btn primary">Resume</button>
          <button type="button" id="btn-pause-settings" class="btn">Settings</button>
          <button type="button" id="btn-title" class="btn ghost">Return to Title</button>
        </div>

        <div id="dialogue-box" class="dialogue hidden">
          <div class="dlg-portrait" id="dlg-portrait"></div>
          <div class="dlg-body">
            <div class="dlg-name" id="dlg-name"></div>
            <p class="dlg-text" id="dlg-text"></p>
            <div class="dlg-choices" id="dlg-choices"></div>
            <button type="button" id="dlg-next" class="btn tiny">Continue</button>
          </div>
        </div>

        <div id="shop-screen" class="panel shop-panel hidden">
          <h2>Memory Market</h2>
          <p class="shop-intro" id="shop-intro">The Archivist weighs what you remember.</p>
          <div id="shop-items" class="shop-items"></div>
          <button type="button" id="btn-shop-leave" class="btn">Leave</button>
        </div>

        <div id="cinematic" class="cinematic hidden">
          <p id="cine-text" class="cine-text"></p>
          <button type="button" id="btn-skip" class="btn tiny ghost skip">Skip</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
